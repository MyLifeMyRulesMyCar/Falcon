# M1.3 validation config: two real internet sources (public HLS + Wowza RTSP)
# mixed with the local testbed (cam_a RTSP w/ zone, cam_d HTTP-FLV).
cameras:
  - name: cam_a
    url: rtsp://127.0.0.1:8554/cam_a
    # M4 zones — polygon in native 640x360 space; draw/edit via the panel.
    zones:
      - name: entry_path
        polygon: [[160, 260], [480, 260], [480, 360], [160, 360]]
        trigger_classes: [bird]
        dwell_time_sec: 2.0
        cooldown_sec: 30
  - name: cam_b
    url: rtmp://127.0.0.1:1935/cam_b
  - name: cam_c
    # M1.3 note: internet sources were validated with cam_b =
    # https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8 (decoded ~31 fps) and
    # cam_c = Wowza's public RTSP endpoint, which was IP-blocked (403) from
    # this board. Reverted here so all four previews run smooth on the
    # testbed; the Wowza URL rotates at https://www.wowza.com/developer/rtsp-stream-test.
    url: http://127.0.0.1:8888/cam_c/index.m3u8
  - name: cam_d
    url: http://127.0.0.1:8080/cam_d.flv

# M5 output. MQTT settings editable live via the panel (persisted here).
mqtt:
  host: 127.0.0.1
  port: 1883
  topic_prefix: nvr
  enabled: true
http_output:
  url: http://127.0.0.1:9999/nvr/events
  timeout_sec: 3
  enabled: false

# v1.1 event snapshots — one annotated .jpg per zone event, retained per
# camera up to max_per_camera (oldest removed first).
snapshots:
  base_dir: snapshots
  max_per_camera: 200

# v1.3 event clips — post-roll mp4 per zone event, ~6fps (the shared preview
# broadcast cadence), hardware-encoded with h264_rkmpp. duration_sec of
# footage after the alert; retained per camera up to max_per_camera.
clips:
  base_dir: clips
  max_per_camera: 30
  duration_sec: 10
