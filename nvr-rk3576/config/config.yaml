# Default cameras: all served by the local testbed (testbed/start_testbed.sh)
# — 360p live-paced Big Buck Bunny clip with rich detections, one distinct
# ingest protocol each (RTSP / RTMP / HLS / HTTP-FLV).
cameras:
  - name: cam_a
    url: rtsp://127.0.0.1:8554/cam_a
  - name: cam_b
    url: rtmp://127.0.0.1:1935/cam_b
  - name: cam_c
    url: http://127.0.0.1:8888/cam_c/index.m3u8
  - name: cam_d
    url: http://127.0.0.1:8080/cam_d.flv
