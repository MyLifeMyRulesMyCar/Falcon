# Generated by the NVR control panel: name/url/zones and MQTT/HTTP
# output edits made in the UI are persisted here (hand edits are
# honored on load, but replaced on the next save).
cameras:
- name: cam_a
  url: rtsp://127.0.0.1:8554/cam_a
  zones:
  - name: entry_path
    polygon:
    - - 160.0
      - 260.0
    - - 480.0
      - 260.0
    - - 480.0
      - 360.0
    - - 160.0
      - 360.0
    trigger_classes:
    - bird
    dwell_time_sec: 2.0
    cooldown_sec: 30.0
- name: cam_b
  url: rtmp://127.0.0.1:1935/cam_b
- name: cam_c
  url: http://127.0.0.1:8888/cam_c/index.m3u8
- name: cam_d
  url: http://127.0.0.1:8080/cam_d.flv
mqtt:
  host: 127.0.0.1
  port: 1883
  topic_prefix: nvr
  enabled: true
http_output:
  url: http://127.0.0.1:9999/nvr/events
  timeout_sec: 3.0
  enabled: false
