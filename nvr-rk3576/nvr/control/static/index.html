<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NVR control panel</title>
<style>
  body { font-family: monospace; margin: 2em; background: #111; color: #ddd; }
  h1 { font-size: 1.2em; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  th, td { border: 1px solid #333; padding: 6px 10px; text-align: left; }
  th { background: #222; }
  input[type=text] { background: #1a1a1a; color: #ddd; border: 1px solid #444; padding: 3px; width: 100%; }
  input:disabled, button:disabled { opacity: 0.4; }
  .badge { padding: 2px 8px; border-radius: 3px; font-size: 0.85em; }
  .running { background: #1d5c1d; }
  .stopped { background: #5c1d1d; }
  .note { color: #888; font-size: 0.85em; }
  .error { color: #ff8080; font-size: 0.85em; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75);
           display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: #1a1a1a; border: 1px solid #444; padding: 14px;
               max-width: 720px; width: 100%; max-height: 92vh; overflow: auto; }
  .zone-stage { position: relative; margin: 8px 0; background: #000; }
  .zone-stage img, .zone-stage canvas { display: block; }
  .zone-stage canvas { position: absolute; left: 0; top: 0; }
  .zone-toolbar { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .zone-edit { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; }
  .zone-edit label { display: flex; flex-direction: column; font-size: 0.85em; color: #aaa; }
  .zone-edit input { width: 120px; background: #1a1a1a; color: #ddd;
                     border: 1px solid #444; padding: 3px; }
  .output-bar { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.on { background: #1d8a1d; }
  .dot.off { background: #555; }
  #mqtt-host, #mqtt-port, #mqtt-prefix { width: 160px; }
  #mqtt-user, #mqtt-pass { width: 140px; }
</style>
</head>
<body>
<h1>NVR control panel</h1>
<div class="note">name/url/zones and MQTT settings edits are persisted to config/config.yaml.</div>
<div class="output-bar">
  <button id="out-mqtt">MQTT: --</button>
  <span id="out-mqtt-dot" class="dot off"></span>
  <button id="out-http">HTTP: --</button>
  <button id="out-mqtt-settings">MQTT settings</button>
  <span id="out-status" class="note"></span>
</div>
<table id="cameras">
  <thead>
    <tr>
      <th>name</th><th>url</th><th></th><th></th><th></th><th></th><th></th>
      <th>status</th><th>fps</th><th>frames</th><th>restarts</th>
      <th>infer fps</th><th>skip%</th><th>detections</th><th>zone events</th><th>preview</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<p class="error" id="global-error"></p>

<div id="zone-modal" class="modal" style="display:none">
  <div class="modal-box">
    <h2 id="zone-title">Zones</h2>
    <div class="zone-stage">
      <img id="zone-img" alt="">
      <canvas id="zone-canvas"></canvas>
    </div>
    <div class="zone-toolbar">
      <button id="zone-new">New zone</button>
      <button id="zone-finish">Finish polygon</button>
      <button id="zone-delete">Delete zone</button>
      <span id="zone-status" class="note"></span>
    </div>
    <div class="zone-edit">
      <label>name <input id="zone-edit-name" type="text"></label>
      <label>classes (comma) <input id="zone-edit-classes" type="text"></label>
      <label>dwell (s) <input id="zone-edit-dwell" type="number" min="0" step="0.1"></label>
      <label>cooldown (s) <input id="zone-edit-cooldown" type="number" min="0" step="0.1"></label>
    </div>
    <div class="zone-toolbar">
      <button id="zone-save">Save zones</button>
      <button id="zone-close">Cancel</button>
    </div>
  </div>
</div>

<div id="mqtt-modal" class="modal" style="display:none">
  <div class="modal-box">
    <h2>MQTT settings</h2>
    <div class="zone-edit">
      <label>host <input id="mqtt-host" type="text"></label>
      <label>port <input id="mqtt-port" type="number" min="1" max="65535"></label>
      <label>topic prefix <input id="mqtt-prefix" type="text"></label>
      <label>username <input id="mqtt-user" type="text" autocomplete="off"></label>
      <label>password <input id="mqtt-pass" type="password" autocomplete="new-password"></label>
    </div>
    <div class="zone-toolbar">
      <button id="mqtt-save">Save</button>
      <button id="mqtt-close">Cancel</button>
      <span id="mqtt-status" class="note"></span>
    </div>
  </div>
</div>

<script>
"use strict";

const tbody = document.querySelector("#cameras tbody");

// Preview <img> elements are cached and REUSED across the 2s poll rebuilds —
// recreating them would restart the MJPEG stream every refresh (flicker).
const imgCache = {};
const boxesMode = {};  // camera name -> draw boxes on preview?

function previewCell(cam) {
  const td = document.createElement("td");
  const img = imgCache[cam.name] || (imgCache[cam.name] = document.createElement("img"));
  img.width = 160;
  img.height = 90;
  img.style.border = "1px solid #444";
  if (cam.alive) {
    img.src = "/stream/" + cam.name + (boxesMode[cam.name] ? "/annotated" : "") + ".mjpg";
  } else {
    img.removeAttribute("src");
  }
  const btn = document.createElement("button");
  btn.textContent = boxesMode[cam.name] ? "boxes: ON" : "boxes: OFF";
  btn.onclick = () => {
    boxesMode[cam.name] = !boxesMode[cam.name];
    img.src = "/stream/" + cam.name + (boxesMode[cam.name] ? "/annotated" : "") + ".mjpg";
    btn.textContent = boxesMode[cam.name] ? "boxes: ON" : "boxes: OFF";
  };
  td.append(img, document.createElement("br"), btn);
  return td;
}

function errorRow(msg) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = 15;
  td.className = "error";
  td.textContent = msg;
  tr.appendChild(td);
  return tr;
}

function row(cam) {
  const tr = document.createElement("tr");
  tr.dataset.cam = cam.name;
  const input = (value, disabled) => {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = value;
    inp.disabled = disabled;
    return inp;
  };

  const nameInput = input(cam.name, cam.alive);
  const urlInput = input(cam.url, cam.alive);
  const running = cam.alive;

  const nameTd = document.createElement("td");
  nameTd.appendChild(nameInput);
  const urlTd = document.createElement("td");
  urlTd.appendChild(urlInput);

  const saveBtn = document.createElement("button");
  saveBtn.textContent = "Save";
  saveBtn.disabled = running;
  const startBtn = document.createElement("button");
  startBtn.textContent = "Start";
  startBtn.disabled = running;
  const stopBtn = document.createElement("button");
  stopBtn.textContent = "Stop";
  stopBtn.disabled = !running;

  // Independent of Start/Stop: flips the DetectionWorker's per-camera flag
  // live (no re-fork); while stopped it just sets the default for next start.
  const detectBtn = document.createElement("button");
  detectBtn.textContent = cam.detection_enabled ? "Detect: ON" : "Detect: OFF";

  // M5: per-camera output content toggles (zone events / detection summaries).
  const zBtn = document.createElement("button");
  zBtn.textContent = "Z:" + (cam.publish_zone_events ? "ON" : "OFF");
  zBtn.onclick = () => act(
    "/api/cameras/" + encodeURIComponent(cam.name) + "/publish/zone_events/"
      + (cam.publish_zone_events ? "off" : "on"),
    { method: "POST" }, refresh);
  const dBtn = document.createElement("button");
  dBtn.textContent = "D:" + (cam.publish_detections ? "ON" : "OFF");
  dBtn.onclick = () => act(
    "/api/cameras/" + encodeURIComponent(cam.name) + "/publish/detections/"
      + (cam.publish_detections ? "off" : "on"),
    { method: "POST" }, refresh);

  // Opens the mediamtx player for this camera on the same host the panel
  // is served from (works from any IP you browse to). cam_d is the
  // standalone HTTP-FLV source, so its page loads but shows no video.
  const watchLink = document.createElement("a");
  watchLink.textContent = "watch";
  watchLink.href = "http://" + location.hostname + ":8888/" + cam.name + "/";
  watchLink.target = "_blank";

  const zonesBtn = document.createElement("button");
  zonesBtn.textContent = "zones";
  zonesBtn.onclick = () => openZoneEditor(cam);

  const badge = document.createElement("span");
  badge.className = "badge " + (running ? "running" : "stopped");
  badge.textContent = running ? "running" : "stopped";

  const note = document.createElement("td");
  note.className = "note";
  if (cam.last_error) {
    note.textContent = cam.last_error.length > 90 ? cam.last_error.slice(0, 90) + "…" : cam.last_error;
    note.classList.add("error");
    note.title = cam.last_error;
  } else if (running) {
    note.textContent = "stop to edit";
  }

  const saveTd = document.createElement("td");
  saveTd.appendChild(saveBtn);
  const startTd = document.createElement("td");
  startTd.appendChild(startBtn);
  const stopTd = document.createElement("td");
  stopTd.appendChild(stopBtn);
  const detectTd = document.createElement("td");
  detectTd.appendChild(detectBtn);
  detectTd.appendChild(zBtn);
  detectTd.appendChild(dBtn);
  const watchTd = document.createElement("td");
  watchTd.appendChild(watchLink);
  watchTd.appendChild(zonesBtn);

  const statusTd = document.createElement("td");
  statusTd.appendChild(badge);
  const fpsTd = document.createElement("td");
  fpsTd.textContent = cam.fps;
  const framesTd = document.createElement("td");
  framesTd.textContent = cam.frames_received;
  const restartsTd = document.createElement("td");
  restartsTd.textContent = cam.restart_count;

  const inferTd = document.createElement("td");
  inferTd.textContent = cam.inference_fps;
  const skipTd = document.createElement("td");
  skipTd.textContent = cam.skip_ratio;
  const detTd = document.createElement("td");
  detTd.className = "note";
  detTd.textContent = (cam.last_detections || [])
    .map((d) => d.class_name + ":" + d.confidence)
    .join(", ");

  const zoneTd = document.createElement("td");
  zoneTd.className = "note";
  zoneTd.textContent = (cam.recent_zone_events || [])
    .slice(-2)
    .map((e) => e.zone + ":" + e.class_name)
    .join(", ");

  const prevTd = previewCell(cam);

  const errorTd = document.createElement("td");
  errorTd.colSpan = 15;
  errorTd.className = "error";

  tr.append(nameTd, urlTd, saveTd, startTd, stopTd, detectTd, watchTd, statusTd, fpsTd, framesTd, restartsTd, inferTd, skipTd, detTd, zoneTd, prevTd, note);
  tr.appendChild(errorTd);

  const act = (url, opts, after) => {
    errorTd.textContent = "";
    fetch(url, opts)
      .then(async (res) => {
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          errorTd.textContent = body.error || ("HTTP " + res.status);
          return;
        }
        after();
      })
      .catch((e) => { errorTd.textContent = "request failed: " + e; });
  };

  saveBtn.onclick = () => {
    const newName = nameInput.value.trim();
    const newUrl = urlInput.value.trim();
    if (!newName) { errorTd.textContent = "name cannot be empty"; return; }
    if (!newUrl) { errorTd.textContent = "url cannot be empty"; return; }
    act("/api/cameras/" + encodeURIComponent(cam.name), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: newName, url: newUrl }),
    }, refresh);
  };
  startBtn.onclick = () => act("/api/cameras/" + encodeURIComponent(cam.name) + "/start", { method: "POST" }, refresh);
  stopBtn.onclick = () => act("/api/cameras/" + encodeURIComponent(cam.name) + "/stop", { method: "POST" }, refresh);
  detectBtn.onclick = () => act(
    "/api/cameras/" + encodeURIComponent(cam.name) + "/detection/" + (cam.detection_enabled ? "off" : "on"),
    { method: "POST" }, refresh);

  return tr;
}

// The poll re-renders the table every 2s, which would wipe any in-progress
// edit. Capture the focused row's inputs before rebuilding and restore them
// afterwards so typing/deleting is never clobbered.
function editingState() {
  const el = document.activeElement;
  if (!el || el.tagName !== "INPUT" || !tbody.contains(el)) return null;
  const tr = el.closest("tr");
  if (!tr || !tr.dataset.cam) return null;
  const inputs = tr.querySelectorAll("input[type=text]");
  if (inputs.length < 2) return null;
  return {
    cam: tr.dataset.cam,
    field: el === inputs[0] ? "name" : "url",
    name: inputs[0].value,
    url: inputs[1].value,
  };
}

function restoreEdit(state) {
  if (!state) return;
  const tr = tbody.querySelector('tr[data-cam="' + CSS.escape(state.cam) + '"]');
  if (!tr) return;
  const inputs = tr.querySelectorAll("input[type=text]");
  if (inputs.length < 2 || inputs[0].disabled || inputs[1].disabled) return;
  inputs[0].value = state.name;
  inputs[1].value = state.url;
  const target = state.field === "name" ? inputs[0] : inputs[1];
  target.focus();
  target.setSelectionRange(target.value.length, target.value.length);
}

function refresh() {
  const pending = editingState();
  fetch("/api/cameras")
    .then((res) => res.json())
    .then((cams) => {
      // Drop previews for cameras that are no longer running (kills their
      // MJPEG connections); live ones are reused from imgCache.
      for (const [name, img] of Object.entries(imgCache)) {
        if (!cams.some((c) => c.name === name && c.alive)) {
          img.removeAttribute("src");
          delete imgCache[name];
        }
      }
      tbody.replaceChildren();
      cams.forEach((cam) => tbody.appendChild(row(cam)));
      restoreEdit(pending);
    })
    .catch((e) => {
      tbody.replaceChildren();
      tbody.appendChild(errorRow("cannot reach /api/cameras: " + e));
    });
}

refresh();
setInterval(refresh, 2000);

/* ---------- M4.1 zone editor (Frigate-style) ---------- */
const zoneModal = document.getElementById("zone-modal");
const zoneTitle = document.getElementById("zone-title");
const zoneImg = document.getElementById("zone-img");
const zoneCanvas = document.getElementById("zone-canvas");
const zoneStatus = document.getElementById("zone-status");
const zoneNew = document.getElementById("zone-new");
const zoneFinish = document.getElementById("zone-finish");
const zoneDelete = document.getElementById("zone-delete");
const zoneSave = document.getElementById("zone-save");
const zoneClose = document.getElementById("zone-close");
const edName = document.getElementById("zone-edit-name");
const edClasses = document.getElementById("zone-edit-classes");
const edDwell = document.getElementById("zone-edit-dwell");
const edCooldown = document.getElementById("zone-edit-cooldown");
const zctx = zoneCanvas.getContext("2d");

const EDIT_W = 640, EDIT_H_MAX = 560;
const ed = { camera: null, width: 0, height: 0, scale: 1,
             zones: [], selected: null, draft: [], drawing: false, drag: null };

function openZoneEditor(cam) {
  ed.camera = cam;
  ed.zones = []; ed.selected = null; ed.draft = []; ed.drawing = false; ed.drag = null;
  zoneTitle.textContent = "Zones — " + cam.name;
  zoneStatus.textContent = "";
  zoneModal.style.display = "flex";
  zoneImg.removeAttribute("src");
  fetch("/api/cameras/" + encodeURIComponent(cam.name) + "/zones")
    .then((res) => res.json())
    .then((data) => {
      ed.width = data.width || 0;
      ed.height = data.height || 0;
      ed.zones = (data.zones || []).map((z) => ({
        ...z,
        polygon: z.polygon.map((p) => ({ x: p[0], y: p[1] })),
      }));
      setupStage();
      if (!ed.width || !ed.height) {
        zoneStatus.textContent = "no frames yet — start the camera to draw zones";
      }
      syncZoneForm(); redrawZones();
    })
    .catch((e) => { zoneStatus.textContent = "cannot load zones: " + e; });
}

function setupStage() {
  if (!ed.width || !ed.height) return;
  const scale = Math.min(EDIT_W / ed.width, EDIT_H_MAX / ed.height);
  const cw = Math.round(ed.width * scale);
  const ch = Math.round(ed.height * scale);
  ed.scale = scale;
  zoneCanvas.width = cw;
  zoneCanvas.height = ch;
  zoneImg.width = cw;
  zoneImg.height = ch;
  if (ed.camera) zoneImg.src = "/stream/" + ed.camera.name + ".mjpg";
}

function closeZoneEditor() {
  zoneModal.style.display = "none";
  zoneImg.removeAttribute("src");
  refresh();
}

function toNative(e) {
  const r = zoneCanvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / ed.scale, y: (e.clientY - r.top) / ed.scale };
}

function drawZonePoly(pts, fill, stroke, lw) {
  if (pts.length < 2) return;
  zctx.beginPath();
  zctx.moveTo(pts[0].x * ed.scale, pts[0].y * ed.scale);
  for (let i = 1; i < pts.length; i++) zctx.lineTo(pts[i].x * ed.scale, pts[i].y * ed.scale);
  if (pts.length > 2) zctx.closePath();
  if (fill) { zctx.fillStyle = fill; zctx.fill(); }
  zctx.strokeStyle = stroke;
  zctx.lineWidth = lw;
  zctx.stroke();
}

function redrawZones() {
  zctx.clearRect(0, 0, zoneCanvas.width, zoneCanvas.height);
  ed.zones.forEach((z, i) => {
    const sel = i === ed.selected;
    drawZonePoly(z.polygon, "rgba(0,255,255,0.10)", sel ? "#ffa500" : "#00ffff", sel ? 3 : 2);
    zctx.fillStyle = sel ? "#ffa500" : "#00ffff";
    zctx.font = "12px monospace";
    zctx.fillText(z.name, z.polygon[0].x * ed.scale + 4, z.polygon[0].y * ed.scale - 4);
    if (sel) {
      z.polygon.forEach((p) => {
        zctx.beginPath();
        zctx.arc(p.x * ed.scale, p.y * ed.scale, 5, 0, Math.PI * 2);
        zctx.fillStyle = "#ffa500";
        zctx.fill();
      });
    }
  });
  if (ed.draft.length) {
    drawZonePoly(ed.draft, "rgba(255,165,0,0.15)", "#ffa500", 1);
    ed.draft.forEach((p) => {
      zctx.beginPath();
      zctx.arc(p.x * ed.scale, p.y * ed.scale, 4, 0, Math.PI * 2);
      zctx.fillStyle = "#ffa500";
      zctx.fill();
    });
  }
}

function pointInZonePoly(poly, p) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if ((yi > p.y) !== (yj > p.y) && p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function hitTestZone(p) {
  for (let i = ed.zones.length - 1; i >= 0; i--) {
    if (pointInZonePoly(ed.zones[i].polygon, p)) return i;
  }
  return null;
}

function nearZoneVertex(zoneIdx, p) {
  const t = 10 / ed.scale;
  const poly = ed.zones[zoneIdx].polygon;
  for (let i = 0; i < poly.length; i++) {
    if (Math.abs(poly[i].x - p.x) <= t && Math.abs(poly[i].y - p.y) <= t) return i;
  }
  return null;
}

zoneCanvas.addEventListener("mousedown", (e) => {
  if (!ed.width) return;
  const p = toNative(e);
  if (ed.drawing) {
    ed.draft.push(p);
    redrawZones();
    return;
  }
  if (ed.selected !== null) {
    const vi = nearZoneVertex(ed.selected, p);
    if (vi !== null) { ed.drag = { type: "vertex", vi: vi }; return; }
    if (pointInZonePoly(ed.zones[ed.selected].polygon, p)) {
      ed.drag = { type: "move", sx: p.x, sy: p.y,
                  orig: ed.zones[ed.selected].polygon.map((v) => ({ ...v })) };
      return;
    }
  }
  ed.selected = hitTestZone(p);
  zoneStatus.textContent = ed.selected === null
    ? "click a zone to edit it, or New zone to draw"
    : "";
  syncZoneForm();
  redrawZones();
});

zoneCanvas.addEventListener("mousemove", (e) => {
  if (!ed.drag || ed.selected === null) return;
  const p = toNative(e);
  const z = ed.zones[ed.selected];
  if (ed.drag.type === "vertex") {
    z.polygon[ed.drag.vi] = { x: p.x, y: p.y };
  } else {
    const dx = p.x - ed.drag.sx, dy = p.y - ed.drag.sy;
    z.polygon = ed.drag.orig.map((v) => ({ x: v.x + dx, y: v.y + dy }));
  }
  redrawZones();
});

window.addEventListener("mouseup", () => { ed.drag = null; });

function syncZoneForm() {
  const z = ed.selected === null ? null : ed.zones[ed.selected];
  edName.value = z ? z.name : "";
  edClasses.value = z ? (z.trigger_classes || []).join(", ") : "";
  edDwell.value = z ? z.dwell_time_sec : "";
  edCooldown.value = z ? z.cooldown_sec : "";
}

[edName, edClasses, edDwell, edCooldown].forEach((el, i) => {
  el.addEventListener("input", () => {
    const z = ed.selected === null ? null : ed.zones[ed.selected];
    if (!z) return;
    if (i === 0) z.name = el.value.trim();
    else if (i === 1) z.trigger_classes = el.value.split(",").map((s) => s.trim()).filter(Boolean);
    else if (i === 2) z.dwell_time_sec = parseFloat(el.value) || 0;
    else z.cooldown_sec = parseFloat(el.value) || 0;
    redrawZones();
  });
});

zoneNew.onclick = () => {
  if (!ed.width || !ed.height) { zoneStatus.textContent = "start the camera first"; return; }
  ed.drawing = true;
  ed.draft = [];
  zoneStatus.textContent = "click on the frame to place vertices (at least 3)";
};

zoneFinish.onclick = () => {
  if (!ed.drawing) return;
  if (ed.draft.length < 3) { zoneStatus.textContent = "a zone needs at least 3 points"; return; }
  ed.zones.push({
    name: "zone_" + (ed.zones.length + 1),
    polygon: ed.draft.slice(),
    trigger_classes: [],
    dwell_time_sec: 2.0,
    cooldown_sec: 30,
  });
  ed.selected = ed.zones.length - 1;
  ed.drawing = false;
  ed.draft = [];
  syncZoneForm();
  redrawZones();
  zoneStatus.textContent = "edit name/classes/dwell/cooldown, then Save zones";
};

zoneDelete.onclick = () => {
  if (ed.selected === null) { zoneStatus.textContent = "select a zone to delete"; return; }
  ed.zones.splice(ed.selected, 1);
  ed.selected = null;
  syncZoneForm();
  redrawZones();
};

zoneSave.onclick = () => {
  if (!ed.camera) return;
  const payload = ed.zones.map((z) => ({
    name: z.name,
    polygon: z.polygon.map((p) => [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10]),
    trigger_classes: z.trigger_classes,
    dwell_time_sec: z.dwell_time_sec,
    cooldown_sec: z.cooldown_sec,
  }));
  fetch("/api/cameras/" + encodeURIComponent(ed.camera.name) + "/zones", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(async (res) => {
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || ("HTTP " + res.status));
      }
      closeZoneEditor();
    })
    .catch((err) => { zoneStatus.textContent = "save failed: " + err.message; });
};

zoneClose.onclick = closeZoneEditor;

/* ---------- M5 output bar (MQTT / HTTP toggles + settings) ---------- */
const outMqttBtn = document.getElementById("out-mqtt");
const outMqttDot = document.getElementById("out-mqtt-dot");
const outHttpBtn = document.getElementById("out-http");
const outStatus = document.getElementById("out-status");
const mqttModal = document.getElementById("mqtt-modal");
const mqttHost = document.getElementById("mqtt-host");
const mqttPort = document.getElementById("mqtt-port");
const mqttPrefix = document.getElementById("mqtt-prefix");
const mqttUser = document.getElementById("mqtt-user");
const mqttPass = document.getElementById("mqtt-pass");
const mqttStatus = document.getElementById("mqtt-status");

function setOutputUI(s) {
  const m = s.mqtt, h = s.http;
  if (m) {
    outMqttBtn.textContent = "MQTT: " + (m.enabled ? "ON" : "OFF");
    outMqttDot.className = "dot " + (m.connected ? "on" : "off");
    outMqttDot.title = m.connected ? "connected" : "disconnected";
  } else {
    outMqttBtn.textContent = "MQTT: n/a";
    outMqttDot.className = "dot off";
  }
  outHttpBtn.textContent = h ? ("HTTP: " + (h.enabled ? "ON" : "OFF")) : "HTTP: n/a";
}

function loadOutputStatus() {
  fetch("/api/output/status")
    .then((res) => res.json())
    .then(setOutputUI)
    .catch(() => {});
}

function toggleOutput(kind, state) {
  return fetch("/api/output/" + kind + "/" + state, { method: "POST" })
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      loadOutputStatus();
    })
    .catch((e) => { outStatus.textContent = kind + " toggle failed: " + e; });
}

outMqttBtn.onclick = () => {
  if (!outMqttBtn.textContent.includes("ON") && !outMqttBtn.textContent.includes("OFF")) return;
  toggleOutput("mqtt", outMqttBtn.textContent.includes("ON") ? "off" : "on");
};
outHttpBtn.onclick = () => toggleOutput("http", outHttpBtn.textContent.includes("ON") ? "off" : "on");

document.getElementById("out-mqtt-settings").onclick = () => {
  fetch("/api/output/status")
    .then((res) => res.json())
    .then((s) => {
      const m = s.mqtt;
      if (!m) { outStatus.textContent = "mqtt not configured in config.yaml"; return; }
      mqttHost.value = m.host || "";
      mqttPort.value = m.port || 1883;
      mqttPrefix.value = m.topic_prefix || "nvr";
      mqttUser.value = m.username || "";
      mqttPass.value = "";
      mqttStatus.textContent = "";
      mqttModal.style.display = "flex";
    })
    .catch((e) => { outStatus.textContent = "cannot load mqtt settings: " + e; });
};

document.getElementById("mqtt-save").onclick = () => {
  const payload = {
    host: mqttHost.value.trim(),
    port: parseInt(mqttPort.value, 10) || 1883,
    topic_prefix: mqttPrefix.value.trim() || "nvr",
    username: mqttUser.value.trim(),
    password: mqttPass.value,
  };
  fetch("/api/output/mqtt", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(async (res) => {
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || ("HTTP " + res.status));
      }
      mqttModal.style.display = "none";
      loadOutputStatus();
    })
    .catch((e) => { mqttStatus.textContent = "save failed: " + e.message; });
};

document.getElementById("mqtt-close").onclick = () => { mqttModal.style.display = "none"; };

loadOutputStatus();


</script>
</body>
</html>
