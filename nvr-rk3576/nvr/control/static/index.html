<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NVR control panel</title>
<style>
  body { font-family: monospace; margin: 2em; background: #111; color: #ddd; }
  h1 { font-size: 1.2em; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  th, td { border: 1px solid #333; padding: 6px 10px; text-align: left; }
  th { background: #222; }
  input[type=text] { background: #1a1a1a; color: #ddd; border: 1px solid #444; padding: 3px; width: 100%; }
  input:disabled, button:disabled { opacity: 0.4; }
  .badge { padding: 2px 8px; border-radius: 3px; font-size: 0.85em; }
  .running { background: #1d5c1d; }
  .stopped { background: #5c1d1d; }
  .note { color: #888; font-size: 0.85em; }
  .error { color: #ff8080; font-size: 0.85em; }
</style>
</head>
<body>
<h1>NVR control panel</h1>
<div class="note">frames/fps shown from the ingest queues; edits are in-memory only (lost on panel restart).</div>
<table id="cameras">
  <thead>
    <tr>
      <th>name</th><th>url</th><th></th><th></th><th></th><th></th><th></th>
      <th>status</th><th>fps</th><th>frames</th><th>restarts</th>
      <th>infer fps</th><th>skip%</th><th>detections</th><th>preview</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<p class="error" id="global-error"></p>

<script>
"use strict";

const tbody = document.querySelector("#cameras tbody");

// Preview <img> elements are cached and REUSED across the 2s poll rebuilds —
// recreating them would restart the MJPEG stream every refresh (flicker).
const imgCache = {};
const boxesMode = {};  // camera name -> draw boxes on preview?

function previewCell(cam) {
  const td = document.createElement("td");
  const img = imgCache[cam.name] || (imgCache[cam.name] = document.createElement("img"));
  img.width = 160;
  img.height = 90;
  img.style.border = "1px solid #444";
  if (cam.alive) {
    img.src = "/stream/" + cam.name + (boxesMode[cam.name] ? "/annotated" : "") + ".mjpg";
  } else {
    img.removeAttribute("src");
  }
  const btn = document.createElement("button");
  btn.textContent = boxesMode[cam.name] ? "boxes: ON" : "boxes: OFF";
  btn.onclick = () => {
    boxesMode[cam.name] = !boxesMode[cam.name];
    img.src = "/stream/" + cam.name + (boxesMode[cam.name] ? "/annotated" : "") + ".mjpg";
    btn.textContent = boxesMode[cam.name] ? "boxes: ON" : "boxes: OFF";
  };
  td.append(img, document.createElement("br"), btn);
  return td;
}

function errorRow(msg) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = 15;
  td.className = "error";
  td.textContent = msg;
  tr.appendChild(td);
  return tr;
}

function row(cam) {
  const tr = document.createElement("tr");
  tr.dataset.cam = cam.name;
  const input = (value, disabled) => {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = value;
    inp.disabled = disabled;
    return inp;
  };

  const nameInput = input(cam.name, cam.alive);
  const urlInput = input(cam.url, cam.alive);
  const running = cam.alive;

  const nameTd = document.createElement("td");
  nameTd.appendChild(nameInput);
  const urlTd = document.createElement("td");
  urlTd.appendChild(urlInput);

  const saveBtn = document.createElement("button");
  saveBtn.textContent = "Save";
  saveBtn.disabled = running;
  const startBtn = document.createElement("button");
  startBtn.textContent = "Start";
  startBtn.disabled = running;
  const stopBtn = document.createElement("button");
  stopBtn.textContent = "Stop";
  stopBtn.disabled = !running;

  // Independent of Start/Stop: flips the DetectionWorker's per-camera flag
  // live (no re-fork); while stopped it just sets the default for next start.
  const detectBtn = document.createElement("button");
  detectBtn.textContent = cam.detection_enabled ? "Detect: ON" : "Detect: OFF";

  // Opens the mediamtx player for this camera on the same host the panel
  // is served from (works from any IP you browse to). cam_d is the
  // standalone HTTP-FLV source, so its page loads but shows no video.
  const watchLink = document.createElement("a");
  watchLink.textContent = "watch";
  watchLink.href = "http://" + location.hostname + ":8888/" + cam.name + "/";
  watchLink.target = "_blank";

  const badge = document.createElement("span");
  badge.className = "badge " + (running ? "running" : "stopped");
  badge.textContent = running ? "running" : "stopped";

  const note = document.createElement("td");
  note.className = "note";
  if (cam.last_error) {
    note.textContent = cam.last_error.length > 90 ? cam.last_error.slice(0, 90) + "…" : cam.last_error;
    note.classList.add("error");
    note.title = cam.last_error;
  } else if (running) {
    note.textContent = "stop to edit";
  }

  const saveTd = document.createElement("td");
  saveTd.appendChild(saveBtn);
  const startTd = document.createElement("td");
  startTd.appendChild(startBtn);
  const stopTd = document.createElement("td");
  stopTd.appendChild(stopBtn);
  const detectTd = document.createElement("td");
  detectTd.appendChild(detectBtn);
  const watchTd = document.createElement("td");
  watchTd.appendChild(watchLink);

  const statusTd = document.createElement("td");
  statusTd.appendChild(badge);
  const fpsTd = document.createElement("td");
  fpsTd.textContent = cam.fps;
  const framesTd = document.createElement("td");
  framesTd.textContent = cam.frames_received;
  const restartsTd = document.createElement("td");
  restartsTd.textContent = cam.restart_count;

  const inferTd = document.createElement("td");
  inferTd.textContent = cam.inference_fps;
  const skipTd = document.createElement("td");
  skipTd.textContent = cam.skip_ratio;
  const detTd = document.createElement("td");
  detTd.className = "note";
  detTd.textContent = (cam.last_detections || [])
    .map((d) => d.class_name + ":" + d.confidence)
    .join(", ");

  const prevTd = previewCell(cam);

  const errorTd = document.createElement("td");
  errorTd.colSpan = 15;
  errorTd.className = "error";

  tr.append(nameTd, urlTd, saveTd, startTd, stopTd, detectTd, watchTd, statusTd, fpsTd, framesTd, restartsTd, inferTd, skipTd, detTd, prevTd, note);
  tr.appendChild(errorTd);

  const act = (url, opts, after) => {
    errorTd.textContent = "";
    fetch(url, opts)
      .then(async (res) => {
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          errorTd.textContent = body.error || ("HTTP " + res.status);
          return;
        }
        after();
      })
      .catch((e) => { errorTd.textContent = "request failed: " + e; });
  };

  saveBtn.onclick = () => {
    const newName = nameInput.value.trim();
    const newUrl = urlInput.value.trim();
    if (!newName) { errorTd.textContent = "name cannot be empty"; return; }
    if (!newUrl) { errorTd.textContent = "url cannot be empty"; return; }
    act("/api/cameras/" + encodeURIComponent(cam.name), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: newName, url: newUrl }),
    }, refresh);
  };
  startBtn.onclick = () => act("/api/cameras/" + encodeURIComponent(cam.name) + "/start", { method: "POST" }, refresh);
  stopBtn.onclick = () => act("/api/cameras/" + encodeURIComponent(cam.name) + "/stop", { method: "POST" }, refresh);
  detectBtn.onclick = () => act(
    "/api/cameras/" + encodeURIComponent(cam.name) + "/detection/" + (cam.detection_enabled ? "off" : "on"),
    { method: "POST" }, refresh);

  return tr;
}

// The poll re-renders the table every 2s, which would wipe any in-progress
// edit. Capture the focused row's inputs before rebuilding and restore them
// afterwards so typing/deleting is never clobbered.
function editingState() {
  const el = document.activeElement;
  if (!el || el.tagName !== "INPUT" || !tbody.contains(el)) return null;
  const tr = el.closest("tr");
  if (!tr || !tr.dataset.cam) return null;
  const inputs = tr.querySelectorAll("input[type=text]");
  if (inputs.length < 2) return null;
  return {
    cam: tr.dataset.cam,
    field: el === inputs[0] ? "name" : "url",
    name: inputs[0].value,
    url: inputs[1].value,
  };
}

function restoreEdit(state) {
  if (!state) return;
  const tr = tbody.querySelector('tr[data-cam="' + CSS.escape(state.cam) + '"]');
  if (!tr) return;
  const inputs = tr.querySelectorAll("input[type=text]");
  if (inputs.length < 2 || inputs[0].disabled || inputs[1].disabled) return;
  inputs[0].value = state.name;
  inputs[1].value = state.url;
  const target = state.field === "name" ? inputs[0] : inputs[1];
  target.focus();
  target.setSelectionRange(target.value.length, target.value.length);
}

function refresh() {
  const pending = editingState();
  fetch("/api/cameras")
    .then((res) => res.json())
    .then((cams) => {
      // Drop previews for cameras that are no longer running (kills their
      // MJPEG connections); live ones are reused from imgCache.
      for (const [name, img] of Object.entries(imgCache)) {
        if (!cams.some((c) => c.name === name && c.alive)) {
          img.removeAttribute("src");
          delete imgCache[name];
        }
      }
      tbody.replaceChildren();
      cams.forEach((cam) => tbody.appendChild(row(cam)));
      restoreEdit(pending);
    })
    .catch((e) => {
      tbody.replaceChildren();
      tbody.appendChild(errorRow("cannot reach /api/cameras: " + e));
    });
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
